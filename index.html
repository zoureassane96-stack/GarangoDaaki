<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GarangoDaaki - Marketplace locale</title>

<meta name="description" content="Achetez, vendez et trouvez des services à Garango.">

<meta name="theme-color" content="#0B7A3E">

<link rel="manifest" href="manifest.json">

<link rel="icon" href="assets/logo.png">

<link rel="apple-touch-icon" href="assets/logo.png">

<link rel="stylesheet" href="css/style.css">

</head>

<body>
  <!-- ==========================
HEADER
========================== -->

<header class="main-header">

  <div class="brand">

<img src="file_000000009964821182652bb3efaf3af8.png" alt="GarangoDaaki">

    <div>
      <h1>GarangoDaaki</h1>
      <p>Le marché près de chez vous</p>
    </div>

  </div>

  <button class="publish-btn" id="publishBtn">
    + Publier
  </button>

</header>
<!-- ==========================
HERO
========================== -->

<section class="hero">

  <h2>Achetez et vendez facilement</h2>

  <p>
    Produits • Services • Immobilier • Agriculture • Emploi
  </p>

  <div class="search-container">

    <input
      type="text"
      id="searchInput"
      placeholder="Que recherchez-vous ?">

    <select id="categoryFilter">
      <option value="">Toutes les catégories</option>
      <option>Agriculture</option>
      <option>Élevage</option>
      <option>Immobilier</option>
      <option>Véhicules</option>
      <option>Téléphones</option>
      <option>Mode</option>
      <option>Services</option>
      <option>Construction</option>
    </select>

    <button id="searchBtn">
      Rechercher
    </button>

  </div>

</section>
<!-- ==========================
CATÉGORIES
========================== -->

<section class="categories-section">

  <div class="section-header">
    <h2>Catégories</h2>
    <a href="#">Voir tout</a>
  </div>

  <div class="categories-grid">

    <div class="category-item">
      <img src="file_000000009964821182652bb3efaf3af8.png" alt="Agriculture">
      <h3>🌾 Agriculture</h3>
    </div>

    <div class="category-item">
      <img src="file_000000009964821182652bb3efaf3af8.png" alt="Élevage">
      <h3>🐄 Élevage</h3>
    </div>

    <div class="category-item">
      <img src="file_000000009964821182652bb3efaf3af8.png" alt="Immobilier">
      <h3>🏠 Immobilier</h3>
    </div>

    <div class="category-item">
      <img src="file_000000009964821182652bb3efaf3af8.png" alt="Véhicules">
      <h3>🚗 Véhicules</h3>
    </div>

    <div class="category-item">
      <img src="file_000000009964821182652bb3efaf3af8.png" alt="Téléphones">
      <h3>📱 Téléphones</h3>
    </div>

    <div class="category-item">
      <img src="file_000000009964821182652bb3efaf3af8.png" alt="Mode">
      <h3>👕 Mode</h3>
    </div>

    <div class="category-item">
      <img src="file_000000009964821182652bb3efaf3af8.png" alt="Services">
      <h3>🛠️ Services</h3>
    </div>

    <div class="category-item">
      <img src="file_000000009964821182652bb3efaf3af8.png" alt="Construction">
      <h3>🧱 Construction</h3>
    </div>

  </div>

</section>
